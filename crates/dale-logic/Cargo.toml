[package]
name = "dale-logic"
description = "Hash-consed logical terms, sorts and operators for DaLe"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
dale-index = { path = "../dale-index" }
dale-macros = { path = "../dale-macros" }
dale-util = { path = "../dale-util" }
hashbrown = { version = "0.15", default-features = false, features = ["inline-more"] }
smallvec = { version = "1", features = ["union"] }
